# سرور رله‌ی TURN برای شبکه‌هایی که مسیر مستقیم بسته است.
#   docker compose -f docker-compose.turn.yml up -d
# بعد در برنامه:
#   TURN_URL="turn:IPسرور:3478?transport=udp,turn:IPسرور:3478?transport=tcp"
#   TURN_USER=bishomare  TURN_PASS=<رمز قوی>
services:
  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: bishomare-turn
    restart: unless-stopped
    network_mode: host
    command: >
      -n
      --log-file=stdout
      --lt-cred-mech
      --fingerprint
      --realm=bishomare
      --user=bishomare:CHANGE_ME_STRONG
      --listening-port=3478
      --min-port=49160
      --max-port=49200
      --no-cli
      --no-multicast-peers
      --stale-nonce=600
