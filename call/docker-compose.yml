# استقرار روی هر VPS با یک دستور (HTTPS خودکار با Caddy)
#
#   ۱) دامنه را به IP سرور وصل کن
#   ۲) cp .env.example .env  و  DOMAIN را داخلش بگذار
#   ۳) docker compose up -d
#
services:
  app:
    build: .
    container_name: bishomare
    restart: unless-stopped
    environment:
      PORT: "8080"
      # CALL_CODE: "کد-خصوصی"
      # TURN_URL: "turn:IP:3478"
      # TURN_USER: "bishomare"
      # TURN_PASS: "رمز"
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    container_name: bishomare-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from ${DOMAIN:?DOMAIN را در فایل .env بگذار} --to app:8080
    depends_on:
      - app
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
