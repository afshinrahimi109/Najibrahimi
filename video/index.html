<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>تیزر کی‌کرافت کره</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px 16px;
    background: radial-gradient(circle at 50% 0%, #2a1440, #0b0616 70%);
    font-family: Vazirmatn, system-ui, sans-serif; color: #fff;
  }
  .wrap { width: min(100%, 460px); display: grid; gap: 18px; }
  h1 { margin: 0; font-size: 26px; font-weight: 900; text-align: center; }
  h1 span { color: #ffd68a; }
  .card {
    border-radius: 26px; overflow: hidden; background: #000;
    box-shadow: 0 26px 60px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.09);
  }
  video { display: block; width: 100%; aspect-ratio: 9 / 16; background: #000; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  a.btn {
    text-decoration: none; padding: 13px 22px; border-radius: 999px; font-weight: 700; font-size: 15px;
    background: #ff5c8a; color: #fff; transition: transform .15s ease, filter .15s;
  }
  a.btn.alt { background: rgba(255,255,255,.12); color: #fff; }
  a.btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
  p.meta { margin: 0; text-align: center; color: #b9b3cc; font-size: 14px; line-height: 1.9; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>تیزر <span>کی‌کرافت کره</span></h1>
    <div class="card">
      <video src="k-craft-korea-teaser-web.mp4" poster="poster.jpg" controls autoplay muted loop playsinline></video>
    </div>
    <div class="row">
      <a class="btn" href="k-craft-korea-teaser-web.mp4" download>دانلود ویدیو (۱۵MB)</a>
      <a class="btn alt" href="poster.jpg" download>دانلود کاور</a>
    </div>
    <p class="meta">۱۰۸۰×۱۹۲۰ • ۶۵ ثانیه • نریشن و متن فارسی<br>مناسب ریلز، استوری، تیک‌تاک و شورتس</p>
  </div>
</body>
</html>
