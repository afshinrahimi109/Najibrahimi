name: Build FreeVPN Android APK

on:
  push:
    branches: [ main, 'arena/**' ]
    paths:
      - 'vpn/android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

# لازم است تا workflow بتواند Release بسازد و APK را داخل خود گیتھاب بگذارد
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK (preinstalled on GitHub runners)
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK" ]; then SDK="$(command -v sdkmanager)"; fi
          echo "using sdkmanager: $SDK"
          "$SDK" --version
          yes | "$SDK" --licenses > /dev/null 2>&1 || true
          "$SDK" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null
          echo "SDK ready"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build debug APK
        run: cd vpn/android && gradle --no-daemon assembleDebug

      - name: Verify and rename APK
        run: |
          set -e
          APK="vpn/android/app/build/outputs/apk/debug/app-debug.apk"
          ls -lh "$APK"
          sha256sum "$APK"
          cp "$APK" vpn/android/app/build/outputs/apk/debug/FreeVPN.apk

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: freevpn-debug-apk
          path: vpn/android/app/build/outputs/apk/debug/FreeVPN.apk
          if-no-files-found: error
          retention-days: 90

      # این مرحله APK را بهصورت فایل قابلدانلود مستقیم داخل صفحه Releases گیتھاب میگذارد
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK: vpn/android/app/build/outputs/apk/debug/FreeVPN.apk
          TAG: v1.0.0
        run: |
          set -e
          NOTES="FreeVPN — اپ VPN اندرویدی ساختهشده از صفر (VpnService + WebSocket/VLESS).
          ساختهشده از ${GITHUB_SHA::7} روی ${GITHUB_REF_NAME}.
          راهنما: vpn/android/README.md"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK#FreeVPN.apk" --clobber --repo "$GITHUB_REPOSITORY"
            echo "APK به Release موجود اضافه/جایگزین شد"
          else
            gh release create "$TAG" "$APK#FreeVPN.apk" \
              --target "$GITHUB_REF_NAME" \
              --title "FreeVPN v1.0.0" \
              --notes "$NOTES" \
              --repo "$GITHUB_REPOSITORY"
            echo "Release جدید ساخته شد"
          fi
          echo "DOWNLOAD_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/FreeVPN.apk"
          echo "همین لینک را در مرورگر گوشی باز کن تا APK مستقیم دانلود شود."
