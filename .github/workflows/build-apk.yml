name: Build FreeVPN Android APK

on:
  push:
    branches: [ main, 'arena/**' ]
    paths:
      - 'vpn/android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

# لازم است تا workflow بتواند Release بسازد، Pages را فعال کند و docs/ را کامیت کند
permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK (preinstalled on GitHub runners)
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK" ]; then SDK="$(command -v sdkmanager)"; fi
          echo "using sdkmanager: $SDK"
          "$SDK" --version
          yes | "$SDK" --licenses > /dev/null 2>&1 || true
          "$SDK" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null
          echo "SDK ready"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build debug APK
        run: cd vpn/android && gradle --no-daemon assembleDebug

      - name: Verify and rename APK
        run: |
          set -e
          APK="vpn/android/app/build/outputs/apk/debug/app-debug.apk"
          ls -lh "$APK"
          sha256sum "$APK"
          cp "$APK" vpn/android/app/build/outputs/apk/debug/FreeVPN.apk

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: freevpn-debug-apk
          path: vpn/android/app/build/outputs/apk/debug/FreeVPN.apk
          if-no-files-found: error
          retention-days: 90

      # APK را بهصورت فایل قابلدانلود داخل صفحه Releases گیتھاب میگذارد
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK: vpn/android/app/build/outputs/apk/debug/FreeVPN.apk
          TAG: v1.0.0
        run: |
          set -e
          NOTES="FreeVPN — اپ VPN اندرویدی ساختهشده از صفر (VpnService + WebSocket/VLESS).
          ساختهشده از ${GITHUB_SHA::7} روی ${GITHUB_REF_NAME}.
          اگر دانلود معلق شد: docs/apk.html لینکهای جایگزین دارد."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK#FreeVPN.apk" --clobber --repo "$GITHUB_REPOSITORY"
            echo "APK به Release موجود اضافه/جایگزین شد"
          else
            gh release create "$TAG" "$APK#FreeVPN.apk" \
              --target "$GITHUB_REF_NAME" \
              --title "FreeVPN v1.0.0" \
              --notes "$NOTES" \
              --repo "$GITHUB_REPOSITORY"
            echo "Release جدید ساخته شد"
          fi

      # CDNـهای Release تو بعضی کشورها مسدود است؛ همان APK را داخل خود مخزن
      # (docs/) هم میگذاریم تا از raw.githubusercontent.com و *.github.io هم بشود گرفت.
      - name: Publish mirror files inside repo (docs/)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK: vpn/android/app/build/outputs/apk/debug/FreeVPN.apk
        run: |
          set -e
          mkdir -p docs
          cp "$APK" docs/FreeVPN.apk
          sha256sum docs/FreeVPN.apk | awk '{print $1}' > docs/FreeVPN.apk.sha256
          base64 -w 76 docs/FreeVPN.apk > docs/FreeVPN.apk.base64.txt
          {
            echo "FreeVPN.apk — built from ${GITHUB_SHA}"
            echo "branch: ${GITHUB_REF_NAME}"
            echo "size: $(wc -c < docs/FreeVPN.apk) bytes"
            echo "sha256: $(cat docs/FreeVPN.apk.sha256)"
            echo "download help: docs/apk.html"
          } > docs/FreeVPN.apk.info.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/FreeVPN.apk docs/FreeVPN.apk.sha256 docs/FreeVPN.apk.base64.txt docs/FreeVPN.apk.info.txt
          if git diff --cached --quiet; then
            echo "mirror files unchanged"
          else
            git commit -m "build(apk): publish APK mirrors into docs [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "::warning::could not push docs mirrors"
          fi

      # Pages روی دامنهٔ *.github.io سرو میدهد که معمولاً از CDNـهای Release در دسترستر است.
      - name: Ensure GitHub Pages for alternative download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" > /dev/null 2>&1; then
            echo "Pages already configured"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" \
              -F "source[branch]=${GITHUB_REF_NAME}" -F "source[path]=/docs" \
              || echo "::warning::Pages could not be enabled automatically (do it in Settings → Pages)"
          fi

      - name: Build summary
        env:
          TAG: v1.0.0
        run: |
          echo "### ✅ FreeVPN APK ساخته شد" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/FreeVPN.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pages: https://afshinrahimi109.github.io/Najibrahimi/FreeVPN.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "- raw: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/docs/FreeVPN.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "- sha256: $(cat docs/FreeVPN.apk.sha256)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "اگر دانلود معلق شد، صفحهٔ docs/apk.html لینکهای جایگزین دارد." >> "$GITHUB_STEP_SUMMARY"
