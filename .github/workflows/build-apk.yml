name: Build FreeVPN Android APK

on:
  push:
    branches: [ arena/f21d825b-najibrahimi ]
    paths:
      - 'vpn/android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null

      - name: Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build debug APK
        run: cd vpn/android && gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: freevpn-debug-apk
          path: vpn/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
