name: insta-agent tests

# Runs the Instagram agent's own checks. They need no secrets and no internet:
# everything talks to the simulator that is built into insta_agent.py.

on:
  push:
    paths:
      - "insta-agent/**"
      - ".github/workflows/insta-agent-tests.yml"
  pull_request:
    paths:
      - "insta-agent/**"
      - ".github/workflows/insta-agent-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: insta-agent-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, python: "3.8" }
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.12" }
          # 3.14 is what Termux installs on a phone today, 3.15 is what it will move to. On these two every
          # deprecation warning counts as a failure, so the next Python cannot break the agent by surprise.
          - { os: ubuntu-latest, python: "3.14", warnings: "error::DeprecationWarning,error::PendingDeprecationWarning,error::SyntaxWarning" }
          - { os: ubuntu-latest, python: "3.15", warnings: "error::DeprecationWarning,error::PendingDeprecationWarning,error::SyntaxWarning" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Tests (built-in simulator, no network)
        working-directory: insta-agent/tests
        env:
          PYTHONWARNINGS: ${{ matrix.warnings }}
        run: python ci_run.py

  panel:
    name: Panel in a real browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"            # the Python that Termux installs
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install the browser driver
        working-directory: insta-agent/tests/ui
        run: npm install --no-audit --no-fund
      - name: Find Chrome
        run: echo "CHROME_PATH=$(which google-chrome || which chromium-browser || which chromium)" >> "$GITHUB_ENV"
      - name: Everyday flows on the demo page
        working-directory: insta-agent/tests/ui
        run: python serve.py flows.mjs demo
      - name: Login, connect and disconnect
        working-directory: insta-agent/tests/ui
        run: python serve.py connect.mjs sim
      - name: An ffmpeg (it makes AAC sound for one check and decodes what the studio made)
        run: python -m pip install --quiet imageio-ffmpeg
      - name: "Without a page: the studio makes a picture and reels (silent, own voice, narrators), the owner takes them out"
        working-directory: insta-agent/tests/ui
        run: python serve.py byhand.mjs hand
      - name: The reels are MP4 files a normal player decodes from the first frame to the last, sound included
        working-directory: insta-agent/tests/ui
        run: python check_made.py
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: panel-screenshots
          path: insta-agent/tests/ui/shots
          if-no-files-found: ignore

  # Only on request: the studio works against the real text and picture services. The tests above never leave the
  # machine, so this is the one place that shows whether those services still answer as the agent expects. It runs
  # when the workflow is started by hand, or when the pushed commit's message contains [live-check].
  live:
    name: Live check of the AI services (on request)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[live-check]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Pillow (only to make small preview pictures of the results)
        run: python -m pip install --quiet pillow
      - name: The narrator (real speech only when the repository has a POLLINATIONS_KEY secret)
        if: always()
        working-directory: insta-agent/tests
        env:
          POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
        run: python live_check.py voice
      - name: A reel from one idea (words, then a picture per scene)
        if: always()
        working-directory: insta-agent/tests
        run: python live_check.py reel
      - name: Two pictures in a row (the free services make the second one wait)
        if: always()
        working-directory: insta-agent/tests
        run: python live_check.py picture

  # Also only on request: the narrator that runs on the owner's device, for real. Its files are downloaded from every
  # address the agent knows (each must hand out the very files the agent expects), then a real browser lets the
  # Persian voice read a reel, a player decodes it and a speech recogniser writes down what it hears. The reel is
  # kept as an artifact, so a person can listen to it.
  narrator:
    name: The Persian narrator, for real (on request)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[live-check]'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install the browser driver
        working-directory: insta-agent/tests/ui
        run: npm install --no-audit --no-fund
      - name: Find Chrome
        run: echo "CHROME_PATH=$(which google-chrome || which chromium-browser || which chromium)" >> "$GITHUB_ENV"
      - name: Every address the narrator's files can come from
        working-directory: insta-agent/tests
        run: python live_check.py pack
      - name: A reel read by the Persian narrator (its files are fetched the way a phone fetches them)
        if: always()
        working-directory: insta-agent/tests/ui
        run: python serve.py realvoice.mjs real
      - name: A player decodes that reel, sound included
        working-directory: insta-agent/tests/ui
        run: |
          python -m pip install --quiet imageio-ffmpeg
          python check_made.py --real
      - name: A speech recogniser writes down what the narrator says
        working-directory: insta-agent/tests/ui
        run: |
          python -m pip install --quiet faster-whisper
          python listen.py
      - name: "The voice lab: which Persian voice and which settings come through best"
        if: always()
        working-directory: insta-agent/tests/ui
        run: |
          python -m pip install --quiet piper-tts faster-whisper
          python voicelab.py
      - name: Keep the reel and the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: persian-narrator-reel
          path: |
            insta-agent/tests/ui/shots/made-reel-persian.mp4
            insta-agent/tests/ui/shots/made-reel-persian.mp4.wav
            insta-agent/tests/ui/shots/12*.png
          if-no-files-found: ignore
